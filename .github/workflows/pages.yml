name: USE MY LOOPING DECK

on:
  push:
    branches: [main, living-workshop-main-build]
    paths:
      - 'app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish Loop Deck
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}pro-rig.html
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workshop
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Workshop app
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Publish Loop Deck
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show Phone URLs
        run: |
          echo "RUSTY PHASEWIRE: ${{ steps.deployment.outputs.page_url }}pro-rig.html"
          echo "TWIS LOOP DECK: ${{ steps.deployment.outputs.page_url }}loop-deck.html"

name: Cloudflare Preview Diagnostic

on:
  push:
    branches:
      - codex/pages-bounded-job-return
    paths:
      - '.github/workflows/cloudflare-preview-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PROJECT: ollie-twis-holo-workshop
      CF_BRANCH: codex/pages-bounded-job-return
      CF_BRANCH_HOST: codex-pages-bounded-job-retu.ollie-twis-holo-workshop.pages.dev
    steps:
      - name: Read sanitized live Pages state
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys, time, urllib.request, urllib.parse, urllib.error

          token = os.environ.get('CLOUDFLARE_API_TOKEN', '')
          account = os.environ.get('CLOUDFLARE_ACCOUNT_ID', '')
          project_name = os.environ['CF_PROJECT']
          branch = os.environ['CF_BRANCH']
          branch_host = os.environ['CF_BRANCH_HOST']
          wanted_sha = os.environ['GITHUB_SHA']
          foundation_keys = [
              'FOUNDATION_ACCESS_AUD',
              'FOUNDATION_ACCESS_DOMAIN',
              'FOUNDATION_OWNER_SUB',
              'FOUNDATION_GITHUB_TOKEN',
              'FOUNDATION_SOURCE_SHA',
              'FOUNDATION_DISPATCH_SHA',
              'FOUNDATION_PHONE_ENABLED',
          ]

          if not token or not account:
              print('DIAG_ERROR=Cloudflare GitHub Actions credentials are unavailable')
              sys.exit(2)

          api = 'https://api.cloudflare.com/client/v4'

          def request(path, fatal=True):
              req = urllib.request.Request(
                  api + path,
                  headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', 'replace')
                  try:
                      err = json.loads(body)
                      messages = [x.get('message', '') for x in err.get('errors', [])]
                  except Exception:
                      messages = [f'HTTP {exc.code}']
                  print(f'API_DENIED {path}: {exc.code} {messages}')
                  if fatal:
                      sys.exit(3)
                  return None
              if not payload.get('success', False):
                  messages = [x.get('message', '') for x in payload.get('errors', [])]
                  print(f'API_FAILED {path}: {messages}')
                  if fatal:
                      sys.exit(4)
                  return None
              return payload.get('result')

          def binding_summary(env_vars):
              env_vars = env_vars or {}
              out = {}
              for key in foundation_keys:
                  entry = env_vars.get(key)
                  if entry is None:
                      out[key] = {'present': False}
                      continue
                  item = {'present': True, 'binding_type': entry.get('type')}
                  if key == 'FOUNDATION_PHONE_ENABLED':
                      value = entry.get('value')
                      item['value'] = value
                      item['value_type'] = type(value).__name__
                      item['exact_string_true'] = isinstance(value, str) and value == 'true'
                  out[key] = item
              return out

          project = request(f'/accounts/{account}/pages/projects/{urllib.parse.quote(project_name)}')
          source_cfg = ((project or {}).get('source') or {}).get('config') or {}
          build_cfg = (project or {}).get('build_config') or {}
          preview_cfg = ((project or {}).get('deployment_configs') or {}).get('preview') or {}
          print('PROJECT=' + json.dumps({
              'name': (project or {}).get('name'),
              'subdomain': (project or {}).get('subdomain'),
              'source_type': ((project or {}).get('source') or {}).get('type'),
              'repo_owner': source_cfg.get('owner'),
              'repo_name': source_cfg.get('repo_name'),
              'production_branch': source_cfg.get('production_branch'),
              'preview_deployment_setting': source_cfg.get('preview_deployment_setting'),
              'preview_branch_includes': source_cfg.get('preview_branch_includes'),
              'preview_branch_excludes': source_cfg.get('preview_branch_excludes'),
              'build_command': build_cfg.get('build_command'),
              'destination_dir': build_cfg.get('destination_dir'),
              'root_dir': build_cfg.get('root_dir'),
          }, sort_keys=True))
          print('PROJECT_PREVIEW_BINDINGS=' + json.dumps(binding_summary(preview_cfg.get('env_vars')), sort_keys=True))

          def list_previews():
              return request(f'/accounts/{account}/pages/projects/{urllib.parse.quote(project_name)}/deployments?env=preview&per_page=50') or []

          deployments = list_previews()
          target = None
          for dep in deployments:
              meta = (dep.get('deployment_trigger') or {}).get('metadata') or {}
              if meta.get('commit_hash') == wanted_sha and meta.get('branch') == branch:
                  target = dep
                  break

          # Cloudflare and this diagnostic are triggered by the same push. Poll only for the exact
          # preview generation created from this diagnostic commit; never inspect or mutate Production.
          for _ in range(24):
              if target and ((target.get('latest_stage') or {}).get('status') in {'success','failure','canceled','skipped'}):
                  break
              time.sleep(5)
              deployments = list_previews()
              target = None
              for dep in deployments:
                  meta = (dep.get('deployment_trigger') or {}).get('metadata') or {}
                  if meta.get('commit_hash') == wanted_sha and meta.get('branch') == branch:
                      target = dep
                      break

          branch_deps = []
          for dep in deployments:
              meta = (dep.get('deployment_trigger') or {}).get('metadata') or {}
              if meta.get('branch') != branch:
                  continue
              branch_deps.append({
                  'id': dep.get('id'),
                  'short_id': dep.get('short_id'),
                  'created_on': dep.get('created_on'),
                  'commit_hash': meta.get('commit_hash'),
                  'trigger_type': (dep.get('deployment_trigger') or {}).get('type'),
                  'environment': dep.get('environment'),
                  'is_skipped': dep.get('is_skipped'),
                  'skip_reason': dep.get('skip_reason'),
                  'latest_stage': dep.get('latest_stage'),
                  'uses_functions': dep.get('uses_functions'),
                  'aliases': dep.get('aliases'),
                  'url': dep.get('url'),
                  'build_config': {
                      'build_command': (dep.get('build_config') or {}).get('build_command'),
                      'destination_dir': (dep.get('build_config') or {}).get('destination_dir'),
                      'root_dir': (dep.get('build_config') or {}).get('root_dir'),
                  },
                  'bindings': binding_summary(dep.get('env_vars')),
              })
              if len(branch_deps) >= 8:
                  break
          print('BRANCH_DEPLOYMENTS=' + json.dumps(branch_deps, sort_keys=True))

          if target is None:
              print('CURRENT_PUSH_DEPLOYMENT=NOT_FOUND')
              sys.exit(5)

          target_id = target.get('id')
          detail = request(f'/accounts/{account}/pages/projects/{urllib.parse.quote(project_name)}/deployments/{target_id}')
          meta = (detail.get('deployment_trigger') or {}).get('metadata') or {}
          aliases = detail.get('aliases') or []
          alias_match = any(branch_host == a.removeprefix('https://').rstrip('/') for a in aliases)
          print('CURRENT_PUSH_DEPLOYMENT=' + json.dumps({
              'id': detail.get('id'),
              'short_id': detail.get('short_id'),
              'environment': detail.get('environment'),
              'commit_hash': meta.get('commit_hash'),
              'branch': meta.get('branch'),
              'is_skipped': detail.get('is_skipped'),
              'latest_stage': detail.get('latest_stage'),
              'uses_functions': detail.get('uses_functions'),
              'url': detail.get('url'),
              'aliases': aliases,
              'branch_alias_attached': alias_match,
              'build_config': {
                  'build_command': (detail.get('build_config') or {}).get('build_command'),
                  'destination_dir': (detail.get('build_config') or {}).get('destination_dir'),
                  'root_dir': (detail.get('build_config') or {}).get('root_dir'),
              },
              'bindings': binding_summary(detail.get('env_vars')),
          }, sort_keys=True))

          # Build/deploy logs: print only lines relevant to config authority, build directories,
          # Functions, or Foundation binding names; redact values to prevent secret disclosure.
          logs = request(f'/accounts/{account}/pages/projects/{urllib.parse.quote(project_name)}/deployments/{target_id}/history/logs', fatal=False)
          if logs is not None:
              rows = logs.get('data', []) if isinstance(logs, dict) else []
              safe_lines = []
              needles = ('wrangler', 'function', 'dist', 'root', 'FOUNDATION_', 'environment variable', 'binding')
              for row in rows:
                  line = str(row.get('line', ''))
                  if not any(n.lower() in line.lower() for n in needles):
                      continue
                  for key in foundation_keys:
                      if key in line:
                          # Preserve presence/type clues, never a Foundation value.
                          left = line.split(key, 1)[0] + key
                          line = left + '=<redacted>'
                          break
                  safe_lines.append({'ts': row.get('ts'), 'line': line[:800]})
              print('SANITIZED_DEPLOYMENT_LOG_LINES=' + json.dumps(safe_lines[-100:], sort_keys=True))

          # Optional Access read. This may be denied if the existing API token is Pages-only.
          access = request(f'/accounts/{account}/access/apps?per_page=100', fatal=False)
          if access is None:
              print('ACCESS_INSPECTION=PERMISSION_UNAVAILABLE')
          else:
              expected_aud = None
              aud_entry = (preview_cfg.get('env_vars') or {}).get('FOUNDATION_ACCESS_AUD')
              if aud_entry:
                  expected_aud = aud_entry.get('value')
              matches = []
              for app in access:
                  domain = app.get('domain') or ''
                  if domain == branch_host or branch_host.endswith(domain.removeprefix('*.')) or domain.endswith('.pages.dev'):
                      matches.append({
                          'name': app.get('name'),
                          'domain': domain,
                          'type': app.get('type'),
                          'aud_matches_preview_binding': bool(expected_aud) and app.get('aud') == expected_aud,
                      })
              print('ACCESS_MATCHES=' + json.dumps(matches, sort_keys=True))

          # Explicit final machine-readable proof gate from Cloudflare deployment metadata.
          live_binding = (detail.get('env_vars') or {}).get('FOUNDATION_PHONE_ENABLED')
          live_value = live_binding.get('value') if live_binding else None
          live_ok = isinstance(live_value, str) and live_value == 'true'
          print('PHONE_FLAG_DEPLOYMENT_SNAPSHOT=' + ('STRING_TRUE' if live_ok else 'NOT_STRING_TRUE'))
          print('DIAG_COMPLETE=1')
          PY

name: Cloudflare Worker Deploy

on:
  workflow_dispatch:
  push:
    branches: [main, living-workshop-main-build]
    paths:
      - 'cloudflare/worker/**'
      - 'wrangler.worker.jsonc'
      - 'package.json'
      - '.github/workflows/cloudflare-worker.yml'

permissions:
  contents: read

env:
  TWIS_DEPLOY_TARGET: cloudflare-worker

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Cloudflare deploy credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub repository secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          echo "Cloudflare deploy credentials are present."

      - name: Install dependencies
        run: npm install

      - name: Contract check before deploy
        run: node tests/cloudflare_worker_contract_test.mjs

      - name: Deploy remote hull
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.worker.jsonc

name: Workshop CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Python syntax
        run: python -m py_compile companion/server.py companion/security.py companion/generation_layer.py
      - name: JavaScript syntax
        run: |
          node --check app/assets/app.js
          node --check app/assets/twis-pro-rig-v4.js
          node --check cloudflare/worker/src/index.js
          test ! -f functions/api/ai/chat.js || node --check functions/api/ai/chat.js
      - name: Pro Rig remote sample reachability
        run: |
          curl -fsSL --range 0-1023 https://raw.githubusercontent.com/Boochi44/free-drum-samples/main/drum-samples/02-bounce/kicks/bounce-kick-01.wav -o /dev/null
          curl -fsSL --range 0-1023 https://raw.githubusercontent.com/n33kos/kokoro-voices/main/samples/am_ash.wav -o /dev/null
          curl -fsSL --range 0-1023 https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js -o /dev/null
          curl -fsSL --range 0-1023 https://unpkg.com/tone@14.8.49/build/Tone.js -o /dev/null
      - name: Smoke test
        run: python tests/smoke_test.py
      - name: Python contract tests
        run: python -m pytest -q tests
      - name: Local companion API e2e
        run: python tests/api_e2e_test.py
      - name: Cloudflare Worker contract
        run: node tests/cloudflare_worker_contract_test.mjs
      - name: Install Node dependencies
        run: npm install
      - name: Install Chromium for browser proof
        run: npx playwright install --with-deps chromium
      - name: Pro Rig browser proof
        run: npm run test:pro-rig-browser
      - name: Build static Pages output
        run: npm run build

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TWIS LOOP DECK</title>
<link rel="manifest" href="loop-deck.webmanifest">
<link rel="icon" type="image/svg+xml" href="assets/icons/twis-loop-deck-icon.svg">
<link rel="apple-touch-icon" href="assets/icons/twis-loop-deck-icon-192.png">
<link rel="stylesheet" href="assets/twis-loop-deck.css">
<style>html,body{margin:0;background:#07090b;min-height:100%;font-family:system-ui,sans-serif}.boot{display:grid;place-items:center;height:100dvh;color:#dce8ed}.boot button{min-width:220px;min-height:60px;border-radius:14px;border:1px solid #35c889;background:#15382c;color:#fff;font-size:18px;font-weight:900;letter-spacing:.05em}</style>
</head>
<body>
<div class="boot" id="boot"><button id="bootBtn">OPEN TWIS LOOP DECK V2</button></div>
<script src="assets/twis-loop-deck-v2.js"></script>
<script src="assets/twis-loop-deck-modules.js"></script>
<script src="assets/twis-loop-calibration.js"></script>
<script src="assets/twis-loop-forge.js"></script>
<script src="assets/twis-loop-sound-rack.js"></script>
<script>window.addEventListener('DOMContentLoaded',()=>{const go=()=>{document.getElementById('boot').style.display='none';window.TWIS_LOOP_DECK.open();setTimeout(()=>{window.TWIS_LOOP_MODULES?.install();window.TWIS_LOOP_CALIBRATION?.install();window.TWIS_LOOP_FORGE?.install();window.TWIS_LOOP_SOUND_RACK?.install()},80)};document.getElementById('bootBtn').onclick=go;go()});if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script>
</body>
</html>

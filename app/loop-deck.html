<body>
<div class="boot" id="boot"><button id="bootBtn">OPEN TWIS LOOP DECK V2</button></div>
<script src="assets/twis-loop-core.js?v=20260919-core1"></script>\n<script src="assets/twis-loop-deck-v2.js?v=20260919-core1"></script>

<script>
window.addEventListener('DOMContentLoaded',()=>{
  const safeInstall=(name,obj)=>{try{obj?.install?.()}catch(e){console.error(`TWIS ${name} install failed`,e)}};
  const go=()=>{
    document.getElementById('boot').style.display='none';
    window.TWIS_LOOP_DECK.open();
    setTimeout(()=>{
      safeInstall('modules',window.TWIS_LOOP_MODULES);
      safeInstall('calibration',window.TWIS_LOOP_CALIBRATION);
      safeInstall('forge',window.TWIS_LOOP_FORGE);
      safeInstall('sound rack',window.TWIS_LOOP_SOUND_RACK);
      safeInstall('personal packs',window.TWIS_LOOP_PERSONAL_PACKS);
      safeInstall('guide',window.TWIS_LOOP_GUIDE);
      safeInstall('colors',window.TWIS_LOOP_COLORS);
      safeInstall('big fuck it',window.TWIS_LOOP_FUCK_IT);
      safeInstall('performance',window.TWIS_LOOP_PERFORMANCE);
      safeInstall('simple perform',window.TWIS_SIMPLE_PERFORM);
    },80);
  };
  document.getElementById('bootBtn').onclick=go;
  go();
});
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js?v=20260919-core1',{updateViaCache:'none'}).catch(()=>{}));}
</script>
